# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: norutoki_development
  host: localhost
  username: postgres
  password: password

test:
  <<: *default
  database: norutoki_test
  host: localhost
  username: postgres
  password: password

production:
  primary: &primary_production
    <<: *default
    database: norutoki_production
    username: norutoki
    password: <%= ENV["NORUTOKI_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: norutoki_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: norutoki_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: norutoki_production_cable
    migrations_paths: db/cable_migrate
